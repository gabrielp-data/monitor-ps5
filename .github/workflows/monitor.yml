name: Monitor PS5

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o mínimo que o GitHub deixa)
  workflow_dispatch:        # botão "Run workflow" pra rodar na hora

permissions:
  contents: write           # pra salvar o historico.csv

concurrency: monitor

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checar preços
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python monitor_ps5.py

      - name: Salvar histórico
        run: |
          git config user.name "monitor-ps5"
          git config user.email "monitor-ps5@users.noreply.github.com"
          git add historico.csv pelando_vistos.txt telegram_vistos.txt alertas_pendentes.json
          git diff --cached --quiet || git commit -m "historico de precos"
          git push
